name: Android 테스트용 APK 만들기
# 결과 APK 고정 주소: https://github.com/<owner>/<repo>/releases/download/test-build/hanas-sandwich-truck.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'package.json', 'capacitor.config.json']
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Prepare Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hanas-sandwich-truck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Update fixed download link (Releases > test-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hanas-sandwich-truck.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build hanas-sandwich-truck.apk --prerelease --target "${{ github.sha }}" --title "테스트용 안드로이드 앱" --notes "가장 최근 빌드입니다. 안드로이드 폰에서 hanas-sandwich-truck.apk 를 눌러 설치하세요."
